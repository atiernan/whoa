<!DOCTYPE html>
<html>
<head>
    <script src="coi-serviceworker.min.js"></script>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Whoa</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: radial-gradient(ellipse at center, #0a1628 0%, #050a12 50%, #000 100%);
        }
        #canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #b8d4e8;
            font-family: 'Times New Roman', serif;
            font-size: 18px;
            text-align: center;
            text-shadow: 0 0 10px rgba(100, 180, 255, 0.5);
        }
        #loading.hidden {
            display: none;
        }
        #progress {
            width: 300px;
            height: 20px;
            background: linear-gradient(180deg, #1a2a3a 0%, #0d1a2a 100%);
            border-radius: 3px;
            margin-top: 20px;
            overflow: hidden;
            border: 1px solid #3a5a7a;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5), 0 0 10px rgba(100, 180, 255, 0.2);
        }
        #progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(180deg, #5cacee 0%, #2a7ab8 50%, #1a5a8a 100%);
            transition: width 0.3s;
            box-shadow: 0 0 15px rgba(100, 200, 255, 0.6);
        }
        #error {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff6b6b;
            font-family: 'Times New Roman', serif;
            font-size: 16px;
            text-align: center;
            max-width: 80%;
            display: none;
            text-shadow: 0 0 10px rgba(255, 100, 100, 0.5);
        }

        /* Directory selection UI */
        #dir-select {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #c8e0f0;
            font-family: 'Times New Roman', serif;
            text-align: center;
            max-width: 500px;
            padding: 40px;
            background: radial-gradient(ellipse at center, rgba(20, 40, 60, 0.8) 0%, rgba(10, 20, 35, 0.9) 100%);
            border: 1px solid #3a6a9a;
            border-radius: 4px;
            box-shadow: 0 0 40px rgba(80, 150, 200, 0.3), inset 0 0 60px rgba(100, 180, 255, 0.05);
        }
        #dir-select.hidden {
            display: none;
        }
        #dir-select h1 {
            font-size: 32px;
            margin-bottom: 20px;
            font-weight: normal;
            letter-spacing: 3px;
            color: #8dc6e8;
            text-shadow: 0 0 20px rgba(100, 180, 255, 0.8), 0 0 40px rgba(100, 180, 255, 0.4);
        }
        #dir-select p {
            color: #8aa8c0;
            margin-bottom: 30px;
            line-height: 1.6;
            font-size: 15px;
        }
        #select-dir-btn {
            background: linear-gradient(180deg, #4a8ac0 0%, #2a5a8a 50%, #1a3a5a 100%);
            color: #e0f0ff;
            border: 1px solid #5a9ad0;
            padding: 15px 40px;
            font-size: 16px;
            font-family: 'Times New Roman', serif;
            letter-spacing: 1px;
            border-radius: 3px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 15px rgba(80, 150, 220, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
        }
        #select-dir-btn:hover {
            background: linear-gradient(180deg, #5a9ad0 0%, #3a6a9a 50%, #2a4a6a 100%);
            box-shadow: 0 0 25px rgba(100, 180, 255, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.3);
            border-color: #7ac0f0;
        }
        #select-dir-btn:active {
            background: linear-gradient(180deg, #2a5a8a 0%, #1a3a5a 50%, #0a2030 100%);
            box-shadow: 0 0 10px rgba(80, 150, 220, 0.3), inset 0 2px 4px rgba(0, 0, 0, 0.3);
        }
        #dir-status {
            margin-top: 20px;
            color: #6a8aa0;
            font-size: 14px;
        }
        #change-dir-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: linear-gradient(180deg, rgba(40, 60, 80, 0.8) 0%, rgba(20, 35, 50, 0.9) 100%);
            color: #8aa8c0;
            border: 1px solid #3a5a7a;
            padding: 8px 16px;
            font-size: 12px;
            font-family: 'Times New Roman', serif;
            border-radius: 3px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 0 8px rgba(80, 150, 200, 0.2);
        }
        #change-dir-btn:hover {
            background: linear-gradient(180deg, rgba(50, 80, 110, 0.9) 0%, rgba(30, 50, 70, 0.95) 100%);
            color: #b8d4e8;
            border-color: #5a8ab0;
            box-shadow: 0 0 12px rgba(100, 180, 255, 0.3);
        }
        #change-dir-btn.hidden {
            display: none;
        }
    </style>
</head>
<body>
    <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>

    <!-- Directory selection screen -->
    <div id="dir-select">
        <h1>Welcome to Whoa</h1>
        <p>
            To get started, please select your game data directory.
            This should be a folder containing extracted game files
            (e.g., Interface/, DBFilesClient/, etc).
        </p>
        <button id="select-dir-btn">Select Data Directory</button>
        <div id="dir-status"></div>
    </div>

    <!-- Loading screen -->
    <div id="loading" class="hidden">
        <div>Loading...</div>
        <div id="progress">
            <div id="progress-bar"></div>
        </div>
        <div id="status"></div>
    </div>

    <!-- Error screen -->
    <div id="error"></div>

    <!-- Change directory button (shown after selection) -->
    <button id="change-dir-btn" class="hidden">Change Directory</button>

    <script>
        // LocalFS Directory Handle Management
        var LocalFSUI = {
            DB_NAME: 'localfs-storage',
            DB_STORE: 'handles',
            DB_KEY: 'rootDirHandle',
            db: null,
            dirHandle: null,

            // Initialize IndexedDB
            initDB: function() {
                var self = this;
                return new Promise(function(resolve, reject) {
                    if (self.db) {
                        resolve(self.db);
                        return;
                    }

                    var request = indexedDB.open(self.DB_NAME, 1);

                    request.onerror = function(event) {
                        reject(event.target.error);
                    };

                    request.onsuccess = function(event) {
                        self.db = event.target.result;
                        resolve(self.db);
                    };

                    request.onupgradeneeded = function(event) {
                        var db = event.target.result;
                        if (!db.objectStoreNames.contains(self.DB_STORE)) {
                            db.createObjectStore(self.DB_STORE);
                        }
                    };
                });
            },

            // Load saved directory handle
            loadHandle: function() {
                var self = this;
                return this.initDB().then(function(db) {
                    return new Promise(function(resolve, reject) {
                        var transaction = db.transaction([self.DB_STORE], 'readonly');
                        var store = transaction.objectStore(self.DB_STORE);
                        var request = store.get(self.DB_KEY);

                        request.onsuccess = function(event) {
                            resolve(event.target.result || null);
                        };

                        request.onerror = function(event) {
                            reject(event.target.error);
                        };
                    });
                });
            },

            // Save directory handle
            saveHandle: function(handle) {
                var self = this;
                return this.initDB().then(function(db) {
                    return new Promise(function(resolve, reject) {
                        var transaction = db.transaction([self.DB_STORE], 'readwrite');
                        var store = transaction.objectStore(self.DB_STORE);
                        var request = store.put(handle, self.DB_KEY);

                        request.onsuccess = function() {
                            resolve();
                        };

                        request.onerror = function(event) {
                            reject(event.target.error);
                        };
                    });
                });
            },

            // Check if we have permission for a handle
            checkPermission: async function(handle) {
                try {
                    var permission = await handle.queryPermission({ mode: 'read' });
                    if (permission === 'granted') {
                        return true;
                    }
                    // Try to request permission
                    permission = await handle.requestPermission({ mode: 'read' });
                    return permission === 'granted';
                } catch (err) {
                    return false;
                }
            },

            // Select a new directory
            selectDirectory: async function() {
                var handle = await window.showDirectoryPicker({ mode: 'read' });
                await this.saveHandle(handle);
                this.dirHandle = handle;
                // Share with LOCALFS library via global
                window.LOCALFS_DIR_HANDLE = handle;
                return handle;
            },

            // Try to restore saved directory
            restoreDirectory: async function() {
                var handle = await this.loadHandle();
                if (!handle) {
                    return null;
                }

                var hasPermission = await this.checkPermission(handle);
                if (hasPermission) {
                    this.dirHandle = handle;
                    // Share with LOCALFS library via global
                    window.LOCALFS_DIR_HANDLE = handle;
                    return handle;
                }

                return null;
            }
        };

        // UI Elements
        var dirSelectScreen = document.getElementById('dir-select');
        var loadingScreen = document.getElementById('loading');
        var errorScreen = document.getElementById('error');
        var selectDirBtn = document.getElementById('select-dir-btn');
        var changeDirBtn = document.getElementById('change-dir-btn');
        var dirStatus = document.getElementById('dir-status');

        // Check for required APIs
        function checkAPIs() {
            if (!navigator.gpu) {
                showError(
                    '<h2>WebGPU Not Supported</h2>' +
                    '<p>Your browser does not support WebGPU.</p>' +
                    '<p>Please use a recent version of Chrome, Edge, or Firefox with WebGPU enabled.</p>'
                );
                return false;
            }

            if (!window.showDirectoryPicker) {
                showError(
                    '<h2>File System Access API Not Supported</h2>' +
                    '<p>Your browser does not support the File System Access API.</p>' +
                    '<p>Please use a recent version of Chrome or Edge.</p>'
                );
                return false;
            }

            return true;
        }

        function showError(message) {
            dirSelectScreen.classList.add('hidden');
            loadingScreen.classList.add('hidden');
            errorScreen.style.display = 'block';
            errorScreen.innerHTML = message;
        }

        function showDirSelect() {
            dirSelectScreen.classList.remove('hidden');
            loadingScreen.classList.add('hidden');
            errorScreen.style.display = 'none';
            changeDirBtn.classList.add('hidden');
        }

        function showLoading() {
            dirSelectScreen.classList.add('hidden');
            loadingScreen.classList.remove('hidden');
            errorScreen.style.display = 'none';
            changeDirBtn.classList.remove('hidden');
        }

        function setStatus(text) {
            dirStatus.textContent = text;
        }

        // Start the application
        function startApp() {
            showLoading();

            // Verify the directory handle is set globally before loading the module
            console.log('Shell: Starting app with directory handle:', window.LOCALFS_DIR_HANDLE);
            if (!window.LOCALFS_DIR_HANDLE) {
                console.error('Shell: No directory handle set!');
            }
        }

        // Handle directory selection
        selectDirBtn.addEventListener('click', async function() {
            setStatus('Selecting directory...');

            try {
                var handle = await LocalFSUI.selectDirectory();
                setStatus('Directory selected: ' + handle.name);
                // Reload the page to restart with the new directory
                window.location.reload();
            } catch (err) {
                if (err.name === 'AbortError') {
                    setStatus('Selection cancelled.');
                } else {
                    setStatus('Error: ' + err.message);
                }
            }
        });

        // Handle directory change
        changeDirBtn.addEventListener('click', async function() {
            try {
                var handle = await LocalFSUI.selectDirectory();
                // Reload the page to restart with the new directory
                window.location.reload();
            } catch (err) {
                // Ignore abort errors
            }
        });

        // Module configuration for Emscripten
        var Module = {
            canvas: (function() {
                var canvas = document.getElementById('canvas');
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                return canvas;
            })(),

            onRuntimeInitialized: function() {
                loadingScreen.classList.add('hidden');
            },

            setStatus: function(text) {
                var statusElement = document.getElementById('status');
                if (statusElement) {
                    statusElement.innerHTML = text;
                }

                var match = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
                if (match) {
                    var progress = parseInt(match[2]) / parseInt(match[4]) * 100;
                    document.getElementById('progress-bar').style.width = progress + '%';
                }
            },

            print: function(text) {
                console.log(text);
            },

            printErr: function(text) {
                console.error(text);
            },

            totalDependencies: 0,
            monitorRunDependencies: function(left) {
                this.totalDependencies = Math.max(this.totalDependencies, left);
                if (left) {
                    Module.setStatus('Loading... (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')');
                } else {
                    Module.setStatus('');
                }
            }
        };

        window.addEventListener('resize', function() {
            var canvas = document.getElementById('canvas');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // Initialize
        async function init() {
            if (!checkAPIs()) {
                return;
            }

            setStatus('Checking for saved directory...');

            try {
                var handle = await LocalFSUI.restoreDirectory();

                if (handle) {
                    setStatus('Restored directory: ' + handle.name);
                    startApp();
                } else {
                    setStatus('');
                    showDirSelect();
                }
            } catch (err) {
                console.error('Init error:', err);
                setStatus('');
                showDirSelect();
            }
        }

        init();
    </script>
    {{{ SCRIPT }}}
</body>
</html>
